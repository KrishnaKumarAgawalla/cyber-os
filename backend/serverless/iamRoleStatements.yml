# DynamoDB Permissions
- Effect: Allow
  Action:
    - dynamodb:GetItem
    - dynamodb:Query
    - dynamodb:PutItem
    - dynamodb:UpdateItem
    - dynamodb:BatchWriteItem
    - dynamodb:DeleteItem
  Resource:
    - "arn:aws:dynamodb:us-east-1:*:table/CyberOS_Data_${self:provider.stage}"
    - "arn:aws:dynamodb:us-east-1:*:table/CyberOS_Data_${self:provider.stage}/index/*"
 
# SNS "Always Free" Permissions
- Effect: Allow
  Action:
    - sns:Publish
  Resource: "*"