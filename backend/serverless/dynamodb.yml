Resources:
  # DynamoDB Resource Configuration
  # Configured for AWS Free Tier (Always Free)
  PortfolioTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Table name includes stage (dev/prod) to prevent environment collisions
      TableName: K-OS-Data-${self:provider.stage}
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TypeIndex
          KeySchema:
            - AttributeName: type
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      # BILLING_SAFEGUARD: 
      # Using PROVISIONED mode ensures we stay within the 25 RCU/WCU free limit.
      # If set to ON_DEMAND, costs can occur after the first 12 months.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      # Enable TTL for automatic cleanup of old data contact messages
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true