handler: services/contact-me/handler.handler
name: ${self:provider.stage}-K-OS-contact-me
timeout: 10
environment:
  LogEnabled: ${file(serverless/environment.yml):${self:provider.stage}.ContactMeLogEnabled}
  TableName: ${file(serverless/environment.yml):${self:provider.stage}.TableName}
  SnsTopicArn: ${file(serverless/environment.yml):${self:provider.stage}.SnsTopicArn}
  CipherKey: ${file(serverless/environment.yml):${self:provider.stage}.CipherKey}
package:
  patterns:
    - services/contact-me/*.*
    - services/contact-me/node_modules/**