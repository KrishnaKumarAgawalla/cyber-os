handler: services/contact-me/handler.handler
name: ${self:provider.stage}-CyberOS-contact-me
timeout: 10
environment:
  ContactMeLogEnabled: ${file(serverless/environment.yml):${self:provider.stage}.ContactMeLogEnabled}
  TableName: ${file(serverless/environment.yml):${self:provider.stage}.TableName}
  SnsTopicArn: !Ref CyberOSNotificationTopic
  CipherKey: ${file(serverless/environment.yml):${self:provider.stage}.CipherKey}
package:
  patterns:
    - services/contact-me/*.*
    - services/contact-me/node_modules/**
url: true