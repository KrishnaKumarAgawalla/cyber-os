handler: services/gateway/handler.handler
name: ${self:provider.stage}-K-OS-gateway
environment:
  LogEnabled: ${file(serverless/environment.yml):${self:provider.stage}.GatewayLogEnabled}
  GetPortfolioLambda: ${file(serverless/environment.yml):${self:provider.stage}.GetPortfolioLambda}
  ContactMeLambda: ${file(serverless/environment.yml):${self:provider.stage}.ContactMeLambda}
  CipherKey: ${file(serverless/environment.yml):${self:provider.stage}.CipherKey}
  R2BaseURL: ${file(serverless/environment.yml):${self:provider.stage}.R2BaseURL}
url:
  cors:
    allowedOrigins:
      - ${env:TEST_URL}
      - ${env:FRONTEND_URL}
    allowedMethods:
      - GET
      - POST
    allowedHeaders:
      - Content-Type
      - X-Content-Encoded
      - Authorization
    exposedResponseHeaders:
      - X-Content-Encoded
      - Access-Control-Allow-Origin
    maxAge: 86400
package:
  include:
    - services/gateway/*.*
    - services/gateway/node_modules/**