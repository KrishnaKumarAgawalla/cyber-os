handler: services/get-portfolio/handler.handler
name: ${self:provider.stage}-CyberOS-get-portfolio
environment:
  LogEnabled: ${file(serverless/environment.yml):${self:provider.stage}.GetPortfolioLogEnabled}
  TableName: ${file(serverless/environment.yml):${self:provider.stage}.TableName}
package:
  include:
    - services/get-portfolio/*.*
    - services/get-portfolio/node_modules/**
url: true
