handler: services/add-item/handler.handler
name: ${self:provider.stage}-CyberOS-add-item
environment:
  LogEnabled: ${file(serverless/environment.yml):${self:provider.stage}.AddIItemLogEnabled}
  TableName: ${file(serverless/environment.yml):${self:provider.stage}.TableName}
package:
  include:
    - services/add-item/*.*
    - services/add-item/node_modules/**
url: true
